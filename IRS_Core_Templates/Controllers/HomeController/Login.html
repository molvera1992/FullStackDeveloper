<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login</title>
	<link rel="stylesheet" href="/IRS_Core_Templates/CssFiles/styleTest.css">
</head>

<body>
	<main>
		<section>
			<form action="" class="form-container">
				<div class="image">
					<img src="/Images/logo.png" alt="Logo IRS" />
				</div>
				<div class="title-form">
					<h1>Information Resource System</h1>
					<p>Modern and efficent apps by DigITal</p>
				</div>
				<div class="username-password">
					<div class="form-group">
						<label for="username">Username</label>
						<input type="text" id="username" name="Username" required placeholder="Ingrese su usuario..." />
					</div>
					<div class="form-group">
						<label for="password">Password</label>
						<input type="password" id="password" name="Password" required placeholder="Ingrese su conrtraseña..." />
					</div>
					<div class="form-forgot-password">
						<a href="">Forgot password?</a>
					</div>
					<button class="btn-login" type="submit">Iniciar Sesion</button>
					<div class="form-new-account">
						<span>Don´t have and Account? </span>
						<a href="">Sign up</a>
					</div>
					<div class="form-guest-access">
						<span>Or</span>
						<button type="submit">Access as Guest</button>
					</div>
				</div>
			</form>
		</section>
	</main>
</body>

</html>
