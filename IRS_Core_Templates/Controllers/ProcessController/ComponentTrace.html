<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>IRS System</title>
	<link rel="stylesheet" href="/IRS_Core_Templates/CssFiles/styleSideBar.css" />
	<script type="module" src="./JavaScript/script.js"></script>
	<!--===== Boxicons CSS =====-->
	<link href="https://unpkg.com/boxicons@2.1.1/css/boxicons.min.css" rel="stylesheet" />
</head>

<body>
	<header class="sidebar">
		<nav class="navbar">
			<div class="header-icon-text">
				<div class="image">
					<a asp-area="Admin" asp-controller="Home" asp-action="index">
						<img src="/Images/logo.png" alt="" />
					</a>
				</div>
				<div>
					<span class="">DigITal</span>
					<span class="">Team</span>
				</div>
			</div>
			<!-- Botón toggle visible en pantallas pequeñas -->
			<button class="navbar-toggle" aria-expanded="false" aria-controls="navbar-list" aria-label="Mostrar menú">
				<span class="sr-only"></span>
				<!-- icono simple (puedes usar fontawesome) -->
				<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
					<path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
				</svg>
			</button>
			<ul class="sidebar-nav-list">
				<li>
					<a href="">
						<i class="bx bx-home-alt icon">
							<span>Home</span>
						</i>
					</a>
				</li>
				<li>
					<a href="">
						<i class="bx bx-book-reader icon">
							<span>Administration</span>
						</i>
					</a>
				</li>
				<li>
					<a href="">
						<i class="bx bxs-report icon">
							<span>Assets</span>
						</i>
					</a>
				</li>
				<li>
					<a href="">
						<i class="bx bx-cog icon">
							<span>Process</span>
						</i>
					</a>
				</li>
				<li>
					<a href="">
						<i class="bx bx-glasses-alt icon">
							<span>Visual Management</span>
						</i>
					</a>
				</li>
				<li>
					<a href="">
						<i class="bx bx-code-alt icon">
							<span>IT Sites</span>
						</i>
					</a>
				</li>
			</ul>
		</nav>
		<div class="logOut-button">
			<div>
				<div>
					<a href="">
						<i class="bx bx-log-out icon">
							<span>Log Out</span>
						</i>
					</a>
				</div>
			</div>
		</div>
	</header>

	<main class="content">
		<form class="form" method="post" action="~/Process/Declation_Program_Insertar">

			<h2>Registro de Programas de Produccion</h2>

			<div class="test">
				<div class="form-info-label">
					<label class="" for="Line">Linea de SMT:</label>
					<select class="" name="Line" required>
						<option value="" disabled selected>Seleccione...</option>
						<option value="@l.SMT">@l.SMT </option>
						<!--<option disabled selected>Seleccione....</option>-->
					</select>
				</div>
				<div class="form-info-label">
					<label class="" for="Program">Nombre del Programa:</label>
					<input type="text" class="form-control" name="Program" placeholder="Ejemplo >> 179_AB_C1_BOT"
						required />
				</div>
				<div class="form-info-label">
					<label class="" for="Noblock"># de PCB dentro del Panel:</label>
					<input type="text" class="form-control" name="Noblock" placeholder="#piezas + 1" required />
				</div>
			</div>

			<div class="test">
				<div class="form-info-label">
					<label class="" for="NIP">Codigo NIP:</label>
					<input type="text" class="" name="NIP" required />
					<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
						stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
						class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-left">
						<path stroke="none" d="M0 0h24v24H0z" fill="none" />
						<path d="M5 12l14 0" />
						<path d="M5 12l6 6" />
						<path d="M5 12l6 -6" />
					</svg>

				</div>
				<div class="form-info-label">
					<label class="" for="Suffix">Sufijo del Programa (Top/Botton):</label>
					<select class="" name="Suffix" required>
						<option value="" disabled selected>Seleccione....</option>
						<option>_T</option>
						<option>_B</option>
					</select>
				</div>
				<div class="form-info-label">
					<label class="" for="PartNumber">Numero de Parte:</label>
					<input type="text" class="" name="PartNumber" required />
				</div>
			</div>

			<div class="test">
				<div class="form-info-label">
					<label class="fs-4 fw-bold" for="Assy_Line">Linea de Ensamble:</label>
					<select class="form-control form-select" name="Assy_Line">
						<option value="" disabled selected>Seleccione....</option>
						<option class="order-first" value="@a"></option>
					</select>
				</div>
				<div class="form-info-label">
					<label class="fs-4 fw-bold" for="CycleTime">Tiempo Ciclo (minutos):</label>
					<input type="text" class="form-control" name="CycleTime" placeholder="Ejemplo >> 0.251" />
				</div>
				<div class="form-info-label">
					<label class="fs-4 fw-bold" for="PzsHr">Piezas X Hora:</label>
					<input type="text" class="form-control" name="PzsHr" />
				</div>
			</div>

			<div class="test">
				<div class="form-buttons">
					<button class="btn-crear" type="submit">Crear</button>
					<button class="btn-reset" type="reset">Resetear</button>
				</div>
			</div>

		</form>
	</main>
</body>

</html>
